# ---- Database (override with environment variables when deployed) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:9902837871}

# creates/updates the contact_messages table automatically.
# For production, switch to "validate" and manage the schema with Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Server ----
server.port=${PORT:8080}
# read the real client IP behind Render/Railway/Nginx (used by the rate limiter)
server.forward-headers-strategy=native

# ---- CORS: comma-separated list of allowed frontend origins (no trailing slash) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
